{% extends "base.html" %}
{% block title %}Assign Technician{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-6"><div class="card shadow-sm"><div class="card-body p-4"><h2>Assign Technician</h2><p><strong>Ticket:</strong> #{{ ticket.pk }} — {{ ticket.title }}</p><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Assign Technician</button> <a class="btn btn-outline-secondary" href="{% url 'maintenance:owner_tickets' %}">Cancel</a></form></div></div></div></div></div>
{% endblock %}
