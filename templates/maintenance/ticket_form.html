{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-7">
<div class="card shadow-sm"><div class="card-body p-4"><h2>{{ title }}</h2><p class="text-muted">Describe the issue clearly so the owner can arrange help.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Submit Request</button> <a class="btn btn-outline-secondary" href="{% url 'maintenance:tenant_tickets' %}">Cancel</a></form>
</div></div></div></div></div>
{% endblock %}
