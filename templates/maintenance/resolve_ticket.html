{% extends "base.html" %}
{% block title %}Resolve Ticket{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-6"><div class="card shadow-sm"><div class="card-body p-4"><h2>Resolve Ticket #{{ ticket.pk }}</h2><p>{{ ticket.title }}</p><form method="post" enctype="multipart/form-data">{% csrf_token %}<label class="form-label">Resolution note</label><textarea name="technician_note" class="form-control mb-3" rows="5" placeholder="Explain what was fixed..." required></textarea><label class="form-label">After-repair photo (optional)</label><input type="file" name="resolution_photo" class="form-control mb-3" accept="image/*"><button class="btn btn-success">Mark Resolved</button></form></div></div></div></div></div>
{% endblock %}
