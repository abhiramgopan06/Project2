<ol class="auth-steps" aria-label="Sign-up progress">
  <li class="{% if step > 1 %}done{% elif step == 1 %}current{% endif %}"><span class="dot">{% if step > 1 %}<i class="bi bi-check-lg"></i>{% else %}1{% endif %}</span><span class="txt">Register</span></li>
  <li class="{% if step > 2 %}done{% elif step == 2 %}current{% endif %}"><span class="dot">{% if step > 2 %}<i class="bi bi-check-lg"></i>{% else %}2{% endif %}</span><span class="txt">Verify email</span></li>
  <li class="{% if step == 3 %}current{% endif %}"><span class="dot">3</span><span class="txt">Login</span></li>
</ol>
