{% extends "base.html" %}
{% block title %}Login | Rental Platform{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
<div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5">
<h2 class="fw-bold">Welcome back</h2><p class="text-secondary">Sign in to continue.</p>
<form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label">Username</label><input class="form-control" type="text" name="username" required autofocus></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
<button class="btn btn-primary w-100" type="submit">Login</button></form>
<p class="text-center mt-4 mb-0">Don't have an account? <a href="{% url 'accounts:register' %}">Register</a></p>
</div></div></div></div></div>
{% endblock %}
