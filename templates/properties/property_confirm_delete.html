{% extends "base.html" %}
{% block title %}Delete Property | Rental Platform{% endblock %}
{% block content %}<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><div class="card border-0 shadow-sm p-4 text-center"><h2>Delete property?</h2><p class="text-secondary">You are about to delete <strong>{{ property.title }}</strong> and its rooms/images.</p><form method="post">{% csrf_token %}<button class="btn btn-danger">Yes, Delete</button><a class="btn btn-outline-secondary" href="{% url 'properties:owner_property_detail' property.pk %}">Cancel</a></form></div></div></div></div>{% endblock %}
